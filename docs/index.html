<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Privacy policies of Genshin Map and RDR2 Map, interactive maps by onthecrow.">
<title>Genshin Map and RDR2 Map</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1d2024;
    --muted: #5b626c;
    --border: #e2ded5;
    --genshin: #2c6a6e;
    --rdr2: #9e1418;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121416;
      --surface: #1a1d21;
      --text: #e6e8eb;
      --muted: #a0a7b0;
      --border: #2b3036;
      --genshin: #7fc3c2;
      --rdr2: #e8726a;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  main {
    max-width: 44rem;
    margin: 0 auto;
    padding: 48px 16px 64px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(2rem, 6vw, 2.6rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .lead { margin: 0 0 32px; color: var(--muted); }

  .app {
    display: block;
    margin: 0 0 16px;
    padding: 18px 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
  }

  .app:hover, .app:focus-visible { border-color: var(--accent); }

  .app h2 { margin: 0; font-size: 1.2rem; line-height: 1.35; }

  .app p { margin: 2px 0 0; color: var(--accent); font-weight: 600; }

  .genshin { --accent: var(--genshin); }

  .rdr2 { --accent: var(--rdr2); }
</style>
</head>
<body>
<main>
  <h1>Privacy Policy</h1>
  <p class="lead">Each app has its own policy.</p>

  <a class="app genshin" href="genshin/privacy-policy/">
    <h2>Genshin Map</h2>
    <p>Privacy Policy →</p>
  </a>

  <a class="app rdr2" href="rdr2/privacy-policy/">
    <h2>RDR2 Map</h2>
    <p>Privacy Policy →</p>
  </a>
</main>
</body>
</html>
